name: gridly
description: "格子记账 — 一格一账的本地优先记账工具"
publish_to: 'none'

version: 1.0.2+10206  # v1.0.2 (D64.83 投资段两个 bug 合并发版:① 切段后按新段校正账户,修投入→收益残留现金账户 + 残留 dest 把「基金」排除掉 ② 投资亏损(负收益)可记录,新增「投资亏损」分类 + 负数红色显示) build 号 = MAJOR×10000 + MINOR×100 + PATCH = 1×10000 + 0×100 + 2 = 10200 + 6 = 10206 (含 D64.76 配色统一 + D64.74 排序修复 + D64.75 小结绿红) ⚠️ 10201 是 D64.71 中间态(把类别 tab X 轴 label 整个删掉),已于 2026-10-20 作废;10202 才是真正的 D64.72 修复;10203 含 D64.73 触摸提示框排版修复;10204 = D64.74 排序修复;10205 = D64.76 配色统一
# - 2026-10-19 user 拍板:发版后修复按 semver 重置 build 号
#   · v1.0.0 = 首发(stable),对应 f97593e,build 0.1.0+104
#   · v1.0.1 = 首个 patch(D70),build 从 0 重新计
#   · v1.0.1+1 = D70.3 修复 commit,XOR 公式 + widget-local state + lift to HomePage
#   · v1.0.1+2 = D70.4 修复 commit,showAppModalBottomSheet 加 WillPopScope 兜底
#   · v1.0.1+3 = D70.5 修复 commit,useRootNavigator 改回 true(反 D66)
#   · v1.0.1+4 = D70.6 修复 commit,WidgetsBindingObserver 全局拦截 back
#                 + 装机实测验证 fix 有效,4 个 sheet 全部 pass
#                 (我的 CSV 导出 + 流水 类型/月份/分类 dropdown)
#   · v1.0.1+5 = D70.6 清理 commit,移除 debug log(纯运行时不需)
# - 后续 1.0.1+6 / 1.0.1+7 ... 同一 patch group 内部 +1
# - 后续 1.0.2 / 1.0.3 另起 patch group 时 build 也重置 0
# - 1.1.0 / 1.2.0 等 minor 跳同理重置 build 0
# - 1.0.x 修复只走 release/1.0 分支(本分支),不影响 main / feature/lan-web-p1(=2.0)
# - 此前 0.3.5 阶段是开发期迭代版本,user 准备发布时改为 1.0.0(首个稳定版)
# - build 保持 +101(compileSdk 36 fix 的实际 commit 数),后续 user 使用期修复
#   按 semver 叠加 1.0.1+102 / 1.0.2+103 ...
# - D64.54 build+1 约定(开发阶段):未发布前每次 commit bump 1
#
# - 2026-10-20 user 拍板(已发布后):**不主动 bump build 号**
#   · app 已发布,user 边用边发现更多问题,累积一批修完再统一叠一次发版
#   · 所以从 1.0.2+10201 起,修 bug 的 commit **不动 version 这一行**
#   · 只有 user 明确说"可以发版 / 叠版本 / 出包"时才 bump
#   · 修复 commit message 里写明"build 号保持 1.0.2+10201(等 user 发版统一叠)"
#   · 配套:versionCode 必须单调递增(Android 拒装降级),所以"不 bump"期间
#     所有修复共用同一 build,user 需自己重编译安装(不能靠改版本号触发更新)

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== UI & 主题 =====
  cupertino_icons: ^1.0.8

  # ===== 状态管理 =====
  flutter_riverpod: ^2.5.1

  # ===== 路由 =====
  go_router: ^14.2.7

  # ===== 数据库 =====
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ===== 图表(P1 启用,先装上不引用)=====
  fl_chart: ^0.69.0

  # ===== 工具 =====
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  flutter_markdown: ^0.7.5
  package_info_plus: ^8.0.0   # 读 pubspec.yaml version + 平台 build number,版本号显示
  # 备份还原(D68):file_picker 选 .sqlite 文件还原(Android 用 SAF,无需 READ_EXTERNAL_STORAGE)
  file_picker: ^8.1.6

  # ===== i18n =====
  # flutter_localizations 已在顶部声明

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # Lint
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
  fonts:
    # Material Icons Round —— 静态纯 filled 字体,按钮图标用这个保证实心
    # Material Symbols Outlined 的 FILL=1 axis 在某些平台不切换字形,改用这个 100% 实心
    - family: MaterialIconsRound
      fonts:
        - asset: assets/fonts/MaterialIconsRound.otf
