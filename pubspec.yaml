name: gridly
description: "格子记账 — 一格一账的本地优先记账工具"
publish_to: 'none'

version: 2.0.0+134  # v2.0.0 · 局域网 Web 伴侣端开发期(2026-10-17 LAN_WEB Open Questions 拍板后升版)
# - v1.0.0+104 是 2026-10-15 D69 定版,D68.3 D68.4 compileSdk 36 fix 的实际 commit 数
# - v2.0.0 作为 LAN_WEB 里程碑主功能,跨过 v0.5.0 / v0.6.0 / v0.7.0 几个中间里程碑
#   详细:docs/LAN_WEB.md
# - D64.54 build+1 约定仍生效:每次 commit bump 1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== UI & 主题 =====
  cupertino_icons: ^1.0.8

  # ===== 状态管理 =====
  flutter_riverpod: ^2.5.1

  # ===== 路由 =====
  go_router: ^14.2.7

  # ===== 数据库 =====
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ===== 图表(P1 启用,先装上不引用)=====
  fl_chart: ^0.69.0

  # ===== 工具 =====
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  flutter_markdown: ^0.7.5
  package_info_plus: ^8.0.0   # 读 pubspec.yaml version + 平台 build number,版本号显示
  # 备份还原(D68):file_picker 选 .sqlite 文件还原(Android 用 SAF,无需 READ_EXTERNAL_STORAGE)
  file_picker: ^8.1.6

  # ===== 局域网 Web 伴侣端(LAN_WEB v2.0.0,P1 骨架,2026-10-17 拍板)=====
  # Android 端起 HTTP server + foreground service 让锁屏 server 仍活
  shelf: ^1.4.2                    # shelf_io / Middleware / Response 等类型(shelf_plus 不 re-export shelf_io)
  shelf_plus: ^1.11.0              # HTTP server(Router().plus + shelfRun(init) 一行起)
  # 降 ^7.0.0:8.x 拉 win32 ^6.0.1,跟 share_plus ^10.0.0 的 win32 ^5.x 冲突
  # 7.0.0 已含 getWifiIP()(LAN_WEB 只用这个 API)
  network_info_plus: ^7.0.0        # WiFi IP(getWifiIP),给用户显示 192.168.x.x
  flutter_foreground_task: ^11.0.3 # Android foreground service,dataSync type(Android 14+ 必需)

  # ===== i18n =====
  # flutter_localizations 已在顶部声明

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  http: ^1.2.0                   # P2 LAN_WEB 集成测试用

  # 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # Lint
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
  fonts:
    # Material Icons Round —— 静态纯 filled 字体,按钮图标用这个保证实心
    # Material Symbols Outlined 的 FILL=1 axis 在某些平台不切换字形,改用这个 100% 实心
    - family: MaterialIconsRound
      fonts:
        - asset: assets/fonts/MaterialIconsRound.otf
